<style>

#lb{max-width:96vw;width:auto}#lb img{max-width:96vw;max-height:88vh;border-radius:20px;display:block}
.blk{display:flex;flex-direction:column;gap:8px}.miss{color:#c0452f}

.step{display:flex;align-items:center;gap:12px;margin:26px 0 12px}
.step .num{width:32px;height:32px;border-radius:50%;background:var(--cream);color:#6b0f1a;display:grid;place-items:center;font:600 15px 'Playfair Display',serif;flex:none}
.panel{padding:16px 18px;margin-bottom:12px;display:flex;flex-direction:column;gap:12px}
.pchips{display:flex;flex-wrap:wrap;gap:8px}
.pchip{display:inline-flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;min-height:38px;font-size:13px;text-transform:none;letter-spacing:0;background:transparent;color:var(--cream);border:1px solid var(--glassb);opacity:.55}
.pchip.on{background:var(--cream);color:#6b0f1a;opacity:1;border-color:transparent}
.av{width:52px;height:52px;border-radius:50%;object-fit:cover;display:grid;place-items:center;color:#fff;font:600 20px 'Playfair Display',serif;flex:none;border:2px solid var(--card)}
.pchip .av,.cchip .av{width:28px;height:28px;font-size:13px;border-width:0}
.seg{display:inline-flex;align-self:flex-start;padding:4px;border-radius:99px;background:var(--glass);border:1px solid var(--glassb)}
.seg button{background:transparent;color:var(--cream);padding:8px 16px;min-height:36px;font-size:12px}
.seg button.on{background:var(--cream);color:#6b0f1a}
.stat2{padding:6px 14px;border-radius:99px;font-size:12px}
.pair{animation:pop .45s both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
.side{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;min-width:0}
.cap{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.arr{width:34px;height:34px;border-radius:50%;background:var(--wine);color:var(--onwine);display:grid;place-items:center;font-size:17px;box-shadow:0 4px 10px #0003}
.chains{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:var(--card);color:var(--ink);padding:12px;border-radius:22px}
.cchip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;border-radius:99px;border:1px solid var(--line);font-size:13px}
.carr{color:var(--wine2);font-weight:600}
option{color:#2a0509;background:#fff6e0}
button.big{padding:15px 30px;font-size:14px}
.frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.frow select{flex:1;min-width:130px}
.saved h3{font-size:20px}
@media(max-width:600px){main{padding:16px 14px}.grid{grid-template-columns:1fr}dialog:not(#lb){max-width:100%;margin:auto 0 0}dialog:not(#lb) .sheet{border-radius:28px 28px 0 0;max-height:92vh;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}}
</style>

<body>
<main id="app"></main>
<nav class="glass" id="nav"><a href="#participants" data-p="participants">Участники</a><a href="#draw" data-p="draw">Жеребьёвка</a><a href="#" id="out">Выйти</a></nav>
<dialog id="dlg"></dialog>
<dialog id="lb"></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
// === ДАННЫЕ ИЗ SUPABASE (Project Settings → API) ===
const SUPABASE_URL="https://wdcpieixyyaytkcotfgw.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_nxRSziTJBkFMxBJLXh2Sbg_2Z1YcYFS";
// ===================================================
const $=(t,a={},...k)=>{const e=document.createElement(t);for(const x in a){if(x==='class')e.className=a[x];else if(x.startsWith('on'))e.addEventListener(x.slice(2),a[x]);else if(x==='text')e.textContent=a[x];else e.setAttribute(x,a[x])}k.flat().forEach(c=>c!=null&&c!==false&&e.append(c));return e};
const hashPage=()=>location.hash.slice(1)==='draw'?'draw':'participants';
let sb=null,session=null,ch=null,parts=[],draws=[],pending=null,cur=hashPage(),loadErr=null,loading=false;
let q='',flt='all',bal=true,noteTxt='',opened={},ed=null,excl=new Set(),forb=[],dv='cards';
const configured=!SUPABASE_URL.includes('YOUR-PROJECT');
const rid=()=>'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const byId=id=>parts.find(p=>p.id===id);
const TRIBES=['Север','Река','Ветер'];
const sp=f=>e=>{e.stopPropagation();f(e)};
const ext=(u,t)=>$('a',{href:u,target:'_blank',rel:'noopener noreferrer',text:t});

// ---------- helpers ----------
const IMGH=/^(i\.imgur\.com|pbs\.twimg\.com|cdn\.discordapp\.com|media\.discordapp\.net|i\.pinimg\.com|images\.unsplash\.com|files\.catbox\.moe|i\.ibb\.co|[\w-]+\.userapi\.com)$/i;
function isImg(u){try{const x=new URL(u);return x.protocol==='https:'&&(/\.(png|jpe?g|gif|webp|avif|svg)$/i.test(x.pathname)||IMGH.test(x.hostname)||/[?&](format|fm)=(png|jpe?g|webp)/i.test(x.search))}catch(e){return false}}
const urls=s=>String(s||'').match(/https:\/\/[^\s<]+/g)||[];
const firstImg=t=>urls(t).find(isImg);
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return 'ссылка'}};
const clean=t=>String(t||'').replace(/https:\/\/[^\s<]+/g,u=>isImg(u)?'':u).replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
const CAT=/(?:https?:\/\/)?(?:www\.)?(catwar\.(?:su|net))\/cat(\d+)/i;
function catInfo(v){v=String(v||'').trim();let m=v.match(CAT);if(m)return{id:m[2],url:'https://'+m[1].toLowerCase()+'/cat'+m[2]};m=v.match(/^(?:cat)?(\d{3,})$/i);if(m)return{id:m[1],url:'https://catwar.su/cat'+m[1]};return null}
function idNode(v){const c=catInfo(v);return c?$('a',{href:c.url,target:'_blank',rel:'noopener noreferrer',text:c.id,onclick:e=>e.stopPropagation()}):(v||'')}
const idText=v=>{const c=catInfo(v);return c?c.id+' ('+c.url+')':v};
function vkUrl(v){v=(v||'').trim();if(!v)return '';if(/^https:\/\//.test(v))return v;return 'https://vk.com/'+v.replace(/^@/,'').replace(/^(https?:\/\/)?(m\.)?vk\.com\//,'')}
function linkify(s){const f=document.createDocumentFragment();clean(s).split(/(https:\/\/[^\s<]+)/g).forEach((t,i)=>{if(i%2)f.append(ext(t,host(t)+' ↗'));else f.append(t)});return f}
function stars(n){n=n||1;const w=$('span',{class:'stars','aria-label':n+' из 3'});w.append('★'.repeat(n));w.append($('i',{text:'★'.repeat(3-n)}));return w}
function toast(t,ms=2200){const e=$('div',{class:'toast glass',text:t});document.body.append(e);setTimeout(()=>e.remove(),ms)}
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Скопировано'),()=>{const a=$('textarea');a.value=t;document.body.append(a);a.select();try{document.execCommand('copy');toast('Скопировано')}catch(e){toast('Не удалось скопировать')}a.remove()})}
function lightbox(u){const d=document.getElementById('lb');d.replaceChildren($('img',{src:u,referrerpolicy:'no-referrer',alt:''}));d.onclick=()=>d.close();d.showModal()}
function img(u,cls,noLb){const i=$('img',{src:u,loading:'lazy',decoding:'async',referrerpolicy:'no-referrer',alt:'',class:cls||''});
  i.addEventListener('error',()=>i.replaceWith(ext(u,'Картинку не удалось показать, открыть ссылку')));
  if(!noLb)i.addEventListener('click',sp(()=>lightbox(u)));return i}
const gallery=l=>l.length?$('div',{class:'gal'},l.map(u=>img(u))):null;
function block(title,text){const t=String(text||'').trim();if(!t)return null;const im=[...new Set(urls(t).filter(isImg))],c=clean(t);
  return $('div',{class:'blk'},$('div',{class:'handle',text:title}),im.length?gallery(im):null,c?$('div',{class:'desc'},linkify(c)):null)}

// ---------- data ----------
function hint(e){
  const m=String((e&&e.message)||e||''),c=e&&e.code;
  if(c==='PGRST204'||/column .*(vk|portfolio|tribe|schema cache)/i.test(m))return 'Не хватает колонки в таблице. Выполните SQL из инструкции в SQL Editor в Supabase.';
  if(c==='42P01'||c==='PGRST205'||/does not exist/i.test(m))return 'Таблицы не найдены. Выполните SQL из инструкции в SQL Editor в Supabase.';
  if(c==='42501'||/permission denied|row-level security|JWT/i.test(m))return 'Нет доступа к данным. Выполните SQL, затем выйдите и войдите снова. Технический текст: '+(c?c+' ':'')+m;
  if(/Invalid API key|apikey/i.test(m))return 'Неверный ключ SUPABASE_ANON_KEY.';
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return 'Нет соединения с Supabase. Проверьте интернет.';
  return 'Ошибка: '+m;
}
async function load(){
  loading=true;if(!parts.length&&!draws.length)render();
  try{
    const [p,d]=await Promise.all([sb.from('participants').select('*').order('created_at'),sb.from('draws').select('*').order('created_at',{ascending:false})]);
    const er=p.error||d.error;
    if(er)loadErr=hint(er);else{loadErr=null;
      parts=p.data.map(r=>({...r,desc:r.descr,at:+new Date(r.created_at)}));
      draws=d.data.map(r=>({...r,at:+new Date(r.created_at)}))}
  }catch(e){loadErr=hint(e)}
  loading=false;render();
}
async function save(coll,id,data){
  try{let r;
    if(coll==='participants'){
      const row={name:data.name,handle:data.handle,vk:data.vk,portfolio:data.portfolio,skill:data.skill,descr:data.desc,ready:data.ready,work:data.work,tribe:data.tribe||null};
      r=byId(id)?await sb.from('participants').update(row).eq('id',id):await sb.from('participants').insert(row);
    }else{
      const row={note:data.note,pairs:data.pairs};
      r=draws.find(x=>x.id===id)?await sb.from('draws').update(row).eq('id',id):await sb.from('draws').insert(row);
    }
    if(r.error){toast('Не сохранено. '+hint(r.error),6000);return false}
  }catch(e){toast('Не сохранено. '+hint(e),6000);return false}
  await load();return true;
}
async function del(coll,id){
  try{const r=await sb.from(coll).delete().eq('id',id);if(r.error){toast('Не удалено. '+hint(r.error),6000);return false}}
  catch(e){toast('Не удалено. '+hint(e),6000);return false}
  await load();return true;
}

// ---------- participant dialogs ----------
function dlgShow(nodes){const d=document.getElementById('dlg');d.replaceChildren($('div',{class:'sheet'},nodes));if(!d.open)d.showModal();return d}
function openProfile(p){
  const v=vkUrl(p.vk),empty=!String(p.portfolio||'').trim()&&!String(p.desc||'').trim();
  const d=dlgShow([
    $('div',{class:'row'},$('span',{class:'pill'+(p.ready?'':' off'),text:p.ready?'Работа готова':'В процессе'}),p.tribe?$('span',{class:'pill off',text:p.tribe}):null,$('span',{class:'spacer'}),stars(p.skill)),
    $('h2',{text:p.name}),
    $('div',{class:'handle'},idNode(p.handle),p.handle&&v?' · ':null,v?ext(v,'Профиль ВК ↗'):null),
    block('Примеры работ',p.portfolio),block('Референс персонажа',p.desc),
    empty?$('div',{class:'handle',text:'Анкета пока не заполнена'}):null,
    p.work&&/^https:\/\//.test(p.work)?[$('div',{class:'handle',text:'Готовая работа'}),isImg(p.work)?img(p.work,'wk'):ext(p.work,'Открыть готовую работу ↗')]:null,
    $('div',{class:'row'},$('button',{class:'wine',text:'Изменить',onclick:()=>openForm(p)}),$('button',{class:'danger',text:'Закрыть',onclick:()=>d.close()}))]);
}
function openForm(p){

function derange(ids,sk,balance,bad){

    const r=[...ids];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}
    if(bad.size&&r.some((x,i)=>bad.has(x+'|'+r[(i+1)%n])))continue;

    const ids=act().map(p=>p.id);if(ids.length<2){toast('Нужно минимум 2 участника');return}
    const sk={};parts.forEach(p=>sk[p.id]=p.skill||1);
    const bad=new Set(forb.flatMap(([a,b])=>[a+'|'+b,b+'|'+a]));
    go.disabled=true;go.textContent='Тасуем…';
    setTimeout(()=>{const r=derange(ids,sk,bal,bad);go.disabled=false;go.textContent='Тасовать';
      if(!r){toast('Не получилось подобрать пары с такими запретами. Уберите часть запретов.',5000);return}
      pending=r;show();out.scrollIntoView({behavior:'smooth',block:'start'})},650);
  }
  show();
  const saved=draws.length?draws.map(savedItem):[$('div',{class:'empty glass',text:'Сохранённых списков пока нет. Их видят все организаторы.'})];
  return $('div',{},
    $('h1',{},'Жеребьёвка ',$('em',{text:'Санты'})),
    $('p',{class:'sub',text:'Выберите участников, при желании добавьте запреты и тасуйте. Нажмите на пару, чтобы открыть анкету получателя.'}),
    $('div',{class:'step'},$('span',{class:'num',text:'1'}),$('h2',{text:'Настройки'})),
    $('div',{class:'panel glass'},$('div',{class:'row'},$('b',{text:'Кто участвует'}),cnt,$('span',{class:'spacer'}),
        $('button',{class:'ghost sm',text:'Все',onclick:()=>{excl.clear();render()}}),
        $('button',{class:'ghost sm',text:'Только с анкетой',onclick:()=>{parts.forEach(p=>{const ok=p.vk&&String(p.portfolio||'').trim()&&String(p.desc||'').trim();ok?excl.delete(p.id):excl.add(p.id)});render()}})),
      chips),
    $('div',{class:'panel glass'},$('b',{text:'Подбор пар'}),seg,$('div',{class:'handle',style:'color:inherit;opacity:.75',text:'«По уровню»: соседи в круге с близким навыком. Сам себе никто не достанется, взаимных обменов («А → Б и Б → А») нет, кроме случая из двух участников.'})),
    $('div',{class:'panel glass'},$('b',{text:'Запретить пары'}),$('div',{class:'handle',style:'color:inherit;opacity:.75',text:'Например, друзья или те, кто уже дарил друг другу. Запрет работает в обе стороны.'}),
      $('div',{class:'frow'},fa,fb2,$('button',{class:'ghost sm',text:'Запретить',onclick:addF})),fchips),
    $('div',{class:'panel glass'},note,go),
    out,
    $('div',{class:'step'},$('span',{class:'num',text:'3'}),$('h2',{text:'Сохранённые списки'})),saved);
}

// ---------- shell ----------
function loginPage(){
  const em=$('input',{type:'text',placeholder:'Email',autocomplete:'username'});
  const pw=$('input',{type:'text',placeholder:'Пароль',autocomplete:'current-password'});pw.type='password';
  const err=$('div',{class:'handle'});
  const go=async()=>{const r=await sb.auth.signInWithPassword({email:em.value.trim(),password:pw.value});if(r.error)err.textContent='Неверный email или пароль'};
  pw.addEventListener('keydown',e=>e.key==='Enter'&&go());
  return $('div',{style:'max-width:420px;margin:10vh auto 0'},$('h1',{},'Тайный Санта ',$('em',{text:'для художников'})),$('p',{class:'sub',text:'Вход только для организаторов.'}),
    $('div',{class:'sheet'},em,pw,err,$('button',{class:'wine',text:'Войти',onclick:go})));
}
function render(){
  const a=document.getElementById('app');
  if(document.getElementById('dlg').open)return;
  document.getElementById('nav').style.display=session?'flex':'none';
  if(!configured){a.replaceChildren($('div',{class:'banner',text:'Впишите SUPABASE_URL и SUPABASE_ANON_KEY в index.html.'}));return}
  if(!session){a.replaceChildren(loginPage());return}
  const bn=loadErr?$('div',{class:'banner'},$('div',{text:loadErr}),$('button',{class:'wine sm',style:'margin-top:8px',text:'Повторить',onclick:()=>load()})):(loading&&!parts.length&&!draws.length?$('div',{class:'banner',text:'Загружаю данные…'}):null);
  a.replaceChildren(bn,cur==='draw'?pageDraw():pageParticipants());
  document.querySelectorAll('#nav a[data-p]').forEach(l=>l.classList.toggle('on',l.dataset.p===cur));
}
addEventListener('hashchange',()=>{cur=hashPage();render();scrollTo(0,0)});
document.getElementById('out').addEventListener('click',e=>{e.preventDefault();sb&&sb.auth.signOut()});
document.getElementById('dlg').addEventListener('close',render);
render();
if(configured){
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  let t=null;const soon=()=>{clearTimeout(t);t=setTimeout(load,300)};
  sb.auth.onAuthStateChange((_e,s2)=>{const was=!!session;session=s2;
    if(session){if(!was)setTimeout(load,0);if(!ch)ch=sb.channel('live').on('postgres_changes',{event:'*',schema:'public'},soon).subscribe()}
    else{if(ch){sb.removeChannel(ch);ch=null}parts=[];draws=[];ed=null;pending=null;render()}});
}
