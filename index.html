<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Тайный Санта для художников</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Open+Sans:wght@400;600&display=swap">
<style>
:root{--bg1:#5a0b16;--bg2:#2a0509;--cream:#fff6e0;--card:#fff6e0;--ink:#6b0f1a;--ink2:#8a3a43;--wine:#6b0f1a;--wine2:#7d1623;--onwine:#fff6e0;--glass:rgba(255,246,224,.16);--glassb:rgba(255,255,255,.38);--line:rgba(107,15,26,.15);--star:#e0a32e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#3a070e;--bg2:#150204;--card:#2b0e12;--ink:#ffe9cf;--ink2:#cfa79c;--wine:#8f1a2b;--line:rgba(255,233,207,.16)}}
:root[data-theme="dark"]{--bg1:#3a070e;--bg2:#150204;--card:#2b0e12;--ink:#ffe9cf;--ink2:#cfa79c;--wine:#8f1a2b;--line:rgba(255,233,207,.16)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:15px/1.5 'Open Sans',system-ui,sans-serif;color:var(--cream);background:radial-gradient(1200px 700px at 15% -10%,var(--bg1),transparent 70%),linear-gradient(180deg,var(--bg2),var(--bg1) 120%);background-color:var(--bg2);background-attachment:fixed;padding-bottom:120px}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 20px 30px,#fff8,transparent),radial-gradient(1.5px 1.5px at 90px 120px,#fff7,transparent),radial-gradient(2.5px 2.5px at 160px 60px,#fff6,transparent),radial-gradient(1.5px 1.5px at 60px 180px,#fff8,transparent);background-size:200px 200px;opacity:.7}
body::after{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg1)}
main{position:relative;max-width:920px;margin:0 auto;padding:20px 16px}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;font-weight:500;margin:0}
h1{font-size:clamp(30px,6vw,44px);line-height:1.1}
h1 em,h2 em{font-style:italic;color:#ffd9b0}
.sub{opacity:.8;margin:8px 0 22px;max-width:560px}
.glass{background:var(--glass);border:1px solid var(--glassb);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);box-shadow:inset 0 1px 0 #fff5,0 10px 30px #0004;border-radius:28px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.stat{padding:8px 16px;border-radius:99px;font-size:13px}
.spacer{flex:1}
button,.btn{font:600 13px 'Open Sans',sans-serif;letter-spacing:.04em;text-transform:uppercase;border:0;border-radius:99px;padding:12px 22px;cursor:pointer;background:var(--cream);color:#6b0f1a;transition:transform .15s}
button:active{transform:scale(.96)}
button.wine{background:var(--wine);color:var(--onwine);box-shadow:inset 0 1px 0 #fff3}
button.ghost{background:var(--glass);color:var(--cream);border:1px solid var(--glassb);backdrop-filter:blur(14px)}
button.sm{padding:7px 14px;font-size:11px}
button.danger{background:transparent;color:var(--ink2);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{background:var(--card);color:var(--ink);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:10px;position:relative;box-shadow:0 10px 30px #0004}
.card h3{font-size:22px;line-height:1.15}
.handle{font-size:12px;color:var(--ink2);letter-spacing:.03em}
.pill{display:inline-block;background:var(--wine);color:var(--onwine);border-radius:99px;padding:3px 12px;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.pill.off{background:transparent;color:var(--ink2);border:1px solid var(--line)}
.stars{color:var(--star);letter-spacing:2px;font-size:17px}.stars i{color:var(--line);font-style:normal}
.desc{font-size:13px;white-space:pre-wrap;word-break:break-word;flex:1}
.desc a,.card a{color:var(--wine2);font-weight:600}
:root[data-theme="dark"] .card a,:root[data-theme="dark"] .desc a{color:#ffb5a0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{padding:40px 20px;text-align:center;opacity:.85}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:4px;padding:6px;border-radius:99px}
nav a{color:var(--cream);text-decoration:none;padding:11px 22px;border-radius:99px;font-weight:600;font-size:14px;opacity:.8}
nav a.on{background:var(--cream);color:#6b0f1a;opacity:1;box-shadow:0 4px 14px #0004}
dialog{border:0;padding:0;background:none;color:var(--ink);max-width:min(480px,94vw);width:100%}
dialog::backdrop{background:#1a0306aa;backdrop-filter:blur(8px)}
.sheet{background:var(--card);border-radius:32px;padding:24px;display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto}
label{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);display:flex;flex-direction:column;gap:6px}
input[type=text],input[type=url],textarea{font:15px 'Open Sans',sans-serif;padding:12px 16px;border-radius:18px;border:1px solid var(--line);background:transparent;color:var(--ink);width:100%}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--wine);outline-offset:1px}
.starpick{display:flex;gap:6px;align-items:center}
.starpick button{background:none;padding:0;font-size:32px;color:var(--line);line-height:1;text-transform:none}
.starpick button.on{color:var(--star)}
.tog{flex-direction:row;align-items:center;gap:12px;text-transform:none;font-size:15px;color:var(--ink);letter-spacing:0}
.tog input{width:22px;height:22px;accent-color:var(--wine)}
.pairs{display:flex;flex-direction:column;gap:10px}
.pair{background:var(--card);color:var(--ink);border-radius:24px;padding:16px 20px;display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.pair .arr{font-size:22px;color:var(--wine2)}
.pair b{font-family:'Playfair Display',serif;font-size:18px;font-weight:500}
.pair small{display:block;color:var(--ink2);font-size:12px}
.pair .more{grid-column:1/-1;border-top:1px solid var(--line);padding-top:8px;font-size:13px;white-space:pre-wrap;word-break:break-word}
@media(max-width:560px){.pair{grid-template-columns:1fr}.pair .arr{transform:rotate(90deg);justify-self:start}}
.opt{display:flex;gap:18px;flex-wrap:wrap;padding:16px 20px;margin-bottom:18px}
.opt label{flex-direction:row;align-items:center;text-transform:none;color:var(--cream);font-size:14px;letter-spacing:0}
.opt input{accent-color:#ffd9b0;width:18px;height:18px}
.saved{padding:16px 20px;margin-bottom:12px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.banner{background:#ffd9b0;color:#4a0a12;padding:10px 16px;border-radius:18px;margin-bottom:16px;font-size:13px}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:50;padding:10px 20px;border-radius:99px;font-size:14px}
</style>
</head>
<body>
<main id="app"></main>
<nav class="glass" id="nav"><a href="#participants" data-p="participants">Участники</a><a href="#draw" data-p="draw">Жеребьёвка</a><a href="#" id="out">Выйти</a></nav>
<dialog id="dlg"></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
// === ВСТАВЬТЕ СВОИ ДАННЫЕ ИЗ SUPABASE (Project Settings → API) ===
const SUPABASE_URL="https://wdcpieixyyaytkcotfgw.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_nxRSziTJBkFMxBJLXh2Sbg_2Z1YcYFS";
// ================================================================
const $=(t,a={},...k)=>{const e=document.createElement(t);for(const x in a){if(x==='class')e.className=a[x];else if(x.startsWith('on'))e.addEventListener(x.slice(2),a[x]);else if(x==='text')e.textContent=a[x];else e.setAttribute(x,a[x])}k.flat().forEach(c=>c!=null&&e.append(c));return e};
let parts=[],draws=[],pending=null,cur=location.hash.slice(1)==='draw'?'draw':'participants';
const rid=()=>'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const byId=id=>parts.find(p=>p.id===id);
function linkify(s){const f=document.createDocumentFragment();String(s||'').split(/(https:\/\/[^\s<]+)/g).forEach((t,i)=>{if(i%2){f.append($('a',{href:t,target:'_blank',rel:'noopener noreferrer',text:t.length>40?t.slice(0,38)+'…':t}))}else f.append(t)});return f}
function stars(n){const w=$('span',{class:'stars','aria-label':n+' из 3'});w.append('★'.repeat(n));w.append($('i',{text:'★'.repeat(3-n)}));return w}
function toast(t,ms=2200){const e=$('div',{class:'toast glass',text:t});document.body.append(e);setTimeout(()=>e.remove(),ms)}
const T=(t,ok)=>toast(t);

// ---------- data ----------
let sb=null,session=null;
const configured=!SUPABASE_URL.includes('YOUR-PROJECT');
let loadErr=null,loading=false;
function hint(e){
  const m=String((e&&e.message)||e||''),c=e&&e.code;
  if(c==='42P01'||c==='PGRST205'||/schema cache|does not exist/i.test(m))return 'Таблицы не найдены. Выполните файл supabase.sql в SQL Editor в Supabase.';
  if(c==='42501'||/permission denied|row-level security|JWT/i.test(m))return 'Нет доступа к данным. Выйдите и войдите снова, а также проверьте, что правила доступа из supabase.sql созданы.';
  if(/Invalid API key|apikey/i.test(m))return 'Неверный ключ SUPABASE_ANON_KEY. Скопируйте anon public key из Project Settings → API.';
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return 'Нет соединения с Supabase. Проверьте интернет и адрес SUPABASE_URL.';
  return 'Ошибка: '+m;
}
async function load(){
  loading=true;if(!parts.length&&!draws.length)render();
  try{
    const [p,d]=await Promise.all([sb.from('participants').select('*').order('created_at'),sb.from('draws').select('*').order('created_at',{ascending:false})]);
    const er=p.error||d.error;
    if(er){loadErr=hint(er)}else{
      loadErr=null;
      parts=p.data.map(r=>({...r,desc:r.descr,at:+new Date(r.created_at)}));
      draws=d.data.map(r=>({...r,at:+new Date(r.created_at)}));
    }
  }catch(e){loadErr=hint(e)}
  loading=false;render();
}
async function save(coll,id,data){
  try{
    let r;
    if(coll==='participants'){
      const row={name:data.name,handle:data.handle,skill:data.skill,descr:data.desc,ready:data.ready,work:data.work};
      r=byId(id)?await sb.from('participants').update(row).eq('id',id):await sb.from('participants').insert(row);
    }else r=await sb.from('draws').insert({note:data.note,pairs:data.pairs});
    if(r.error){toast('Не сохранено. '+hint(r.error),6000);return false}
  }catch(e){toast('Не сохранено. '+hint(e),6000);return false}
  await load();return true;
}
async function del(coll,id){
  try{
    const r=await sb.from(coll).delete().eq('id',id);
    if(r.error){toast('Не удалено. '+hint(r.error),6000);return false}
  }catch(e){toast('Не удалено. '+hint(e),6000);return false}
  await load();return true;
}

// ---------- participant form ----------
function openForm(p){
  const d=document.getElementById('dlg');const v={name:'',handle:'',skill:2,desc:'',ready:false,work:'',...(p||{})};
  let skill=v.skill;
  const name=$('input',{type:'text',value:v.name,placeholder:'Имя',maxlength:60});
  const handle=$('input',{type:'text',value:v.handle,placeholder:'@nickname или ID',maxlength:60});
  const desc=$('textarea',{placeholder:'Что любишь рисовать, чего не хочешь, ссылки на референсы (https://…)'});desc.value=v.desc;
  const ready=$('input',{type:'checkbox'});ready.checked=!!v.ready;
  const work=$('input',{type:'url',value:v.work,placeholder:'https://… ссылка на готовую работу'});
  const sp=$('div',{class:'starpick'});
  const paint=()=>[...sp.children].forEach((b,i)=>b.classList.toggle('on',i<skill));
  [1,2,3].forEach(n=>sp.append($('button',{type:'button','aria-label':n+' из 3',text:'★',onclick:()=>{skill=n;paint()}})));paint();
  const err=$('div',{class:'handle'});
  d.replaceChildren($('div',{class:'sheet'},
    $('h2',{text:p?'Изменить участника':'Новый участник'}),
    $('label',{text:'Имя'},name),$('label',{text:'ID / ник'},handle),
    $('label',{text:'Уровень навыка'},sp),
    $('label',{text:'Описание и референсы'},desc),
    $('label',{class:'tog'},ready,'Работа готова'),
    $('label',{text:'Ссылка на готовую работу'},work),err,
    $('div',{class:'row'},
      $('button',{class:'wine',text:'Сохранить',onclick:async()=>{
        if(!name.value.trim()){err.textContent='Укажи имя';return}
        if(work.value&&!/^https:\/\//.test(work.value.trim())){err.textContent='Ссылка должна начинаться с https://';return}
        const ok=await save('participants',p?p.id:rid(),{name:name.value.trim(),handle:handle.value.trim(),skill,desc:desc.value.trim(),ready:ready.checked,work:work.value.trim()});
        if(ok)d.close();else err.textContent='Не удалось сохранить, данные в форме не потеряны. Попробуйте ещё раз.'}}),
      $('button',{class:'danger',text:'Отмена',onclick:()=>d.close()}),
      p&&$('button',{class:'danger',text:'Удалить',onclick:async()=>{if(confirm('Удалить участника?')){if(await del('participants',p.id))d.close()}}}))));
  d.showModal();name.focus();
}

// ---------- pages ----------
function pageParticipants(){
  const ready=parts.filter(p=>p.ready).length;
  const grid=$('div',{class:'grid'});
  [...parts].sort((a,b)=>(a.at||0)-(b.at||0)).forEach(p=>{
    grid.append($('div',{class:'card'},
      $('div',{class:'row'},$('span',{class:'pill'+(p.ready?'':' off'),text:p.ready?'Работа готова':'В процессе'}),$('span',{class:'spacer'}),stars(p.skill||1)),
      $('div',{},$('h3',{text:p.name}),$('div',{class:'handle',text:p.handle})),
      $('div',{class:'desc'},p.desc?linkify(p.desc):$('span',{class:'handle',text:'Без описания'})),
      p.work&&/^https:\/\//.test(p.work)?$('a',{href:p.work,target:'_blank',rel:'noopener noreferrer',text:'Смотреть готовую работу →'}):null,
      $('div',{class:'row'},$('button',{class:'wine sm',text:'Изменить',onclick:()=>openForm(p)}),
        $('button',{class:'danger sm',text:p.ready?'Снять «готово»':'Отметить готовой',onclick:()=>save('participants',p.id,{...p,ready:!p.ready})}))));
  });
  return $('div',{},
    $('h1',{},'Тайный Санта ',$('em',{text:'для художников'})),
    $('p',{class:'sub',text:'Добавь участников, отметь уровень навыка и готовность работ. Затем перейди к жеребьёвке.'}),
    $('div',{class:'bar'},$('span',{class:'stat glass',text:'Участников: '+parts.length}),$('span',{class:'stat glass',text:'Готово: '+ready+' / '+parts.length}),$('span',{class:'spacer'}),$('button',{text:'+ Добавить',onclick:()=>openForm()})),
    parts.length?grid:$('div',{class:'empty glass',text:'Пока никого нет. Нажми «Добавить», чтобы создать первого участника.'}));
}

function derange(ids,skillOf,balance){
  const n=ids.length;let best=null,bs=1e9;const tries=balance?600:1;
  for(let t=0;t<tries;t++){
    let r;do{r=[...ids];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}}while(r.some((x,i)=>x===ids[i])&&(t>=0));
    const s=balance?r.reduce((a,x,i)=>a+Math.abs(skillOf[ids[i]]-skillOf[x]),0):0;
    if(s<bs){bs=s;best=r;if(!balance)break}
  }
  return ids.map((g,i)=>({g,r:best[i]}));
}
function pairRow(pr){
  const g=byId(pr.g),r=byId(pr.r);
  return $('div',{class:'pair'},
    $('div',{},$('b',{text:g?.name||pr.gn}),$('small',{text:g?.handle||''})),
    $('span',{class:'arr',text:'→'}),
    $('div',{},$('b',{text:r?.name||pr.rn}),$('small',{},r?stars(r.skill||1):'',' ',r?.handle||'')),
    r&&r.desc?$('div',{class:'more'},linkify(r.desc)):null);
}
function pageDraw(){
  const balance=$('input',{type:'checkbox'});balance.checked=true;
  const note=$('input',{type:'text',placeholder:'Название списка, например «Зима 2026»',maxlength:80});
  const out=$('div',{class:'pairs'});const actions=$('div',{class:'row'});
  const show=()=>{out.replaceChildren(...(pending?pending.map(pairRow):[]));actions.replaceChildren(...(pending?[
    $('button',{class:'wine',text:'Сохранить список',onclick:async()=>{if(!await save('draws',rid(),{at:Date.now(),note:note.value.trim()||'Без названия',pairs:pending.map(x=>({...x,gn:byId(x.g)?.name||'',rn:byId(x.r)?.name||''}))}))return;pending=null;toast('Список сохранён');render()}}),
    $('button',{class:'ghost',text:'Перетасовать заново',onclick:run})]:[]))};
  const run=()=>{if(parts.length<2){toast('Нужно минимум 2 участника');return}
    const sk={};parts.forEach(p=>sk[p.id]=p.skill||1);pending=derange(parts.map(p=>p.id),sk,balance.checked);show()};
  const saved=$('div',{});
  [...draws].sort((a,b)=>b.at-a.at).forEach(dr=>{
    const body=$('div',{class:'pairs',style:'display:none;margin:0 0 14px'},(dr.pairs||[]).map(pairRow));
    saved.append($('div',{class:'saved glass'},$('div',{},$('b',{text:dr.note}),$('div',{class:'handle',style:'color:inherit;opacity:.7',text:new Date(dr.at).toLocaleString('ru-RU')+' · пар: '+(dr.pairs||[]).length})),$('span',{class:'spacer'}),
      $('button',{class:'ghost sm',text:'Показать',onclick:e=>{const h=body.style.display==='none';body.style.display=h?'flex':'none';e.target.textContent=h?'Скрыть':'Показать'}}),
      $('button',{class:'ghost sm',text:'Удалить',onclick:()=>confirm('Удалить сохранённый список?')&&del('draws',dr.id)})),body);
  });
  show();
  return $('div',{},
    $('h1',{},'Жеребьёвка ',$('em',{text:'Санты'})),
    $('p',{class:'sub',text:'Каждый художник рисует для одного человека и получает работу от другого. Сам себе никто не достанется.'}),
    $('div',{class:'opt glass'},$('label',{},balance,'Подбирать пары с близким уровнем'),note,$('button',{text:'Тасовать',onclick:run})),
    out,actions,
    $('h2',{style:'margin:32px 0 14px'},'Сохранённые ',$('em',{text:'списки'})),
    draws.length?saved:$('div',{class:'empty glass',text:'Сохранённых списков пока нет. Их видят все организаторы.'}));
}

function loginPage(){
  const em=$('input',{type:'text',placeholder:'Email',autocomplete:'username'});
  const pw=$('input',{type:'text',placeholder:'Пароль',autocomplete:'current-password'});pw.type='password';
  const err=$('div',{class:'handle',style:'color:var(--ink)'});
  const go=async()=>{const r=await sb.auth.signInWithPassword({email:em.value.trim(),password:pw.value});if(r.error)err.textContent='Неверный email или пароль'};
  pw.addEventListener('keydown',e=>e.key==='Enter'&&go());
  return $('div',{style:'max-width:420px;margin:12vh auto 0'},$('h1',{},'Тайный Санта ',$('em',{text:'для художников'})),$('p',{class:'sub',text:'Вход только для организаторов.'}),
    $('div',{class:'sheet'},em,pw,err,$('button',{class:'wine',text:'Войти',onclick:go})));
}
function render(){
  const a=document.getElementById('app');
  if(document.getElementById('dlg').open)return;
  const nav=document.getElementById('nav');nav.style.display=session?'flex':'none';
  if(!configured){a.replaceChildren($('div',{class:'banner',text:'Откройте index.html и впишите SUPABASE_URL и SUPABASE_ANON_KEY (см. README).'}));return}
  if(!session){a.replaceChildren(loginPage());return}
  const bn=loadErr?$('div',{class:'banner'},$('div',{text:loadErr}),$('button',{class:'wine sm',style:'margin-top:8px',text:'Повторить',onclick:()=>load()})):(loading&&!parts.length&&!draws.length?$('div',{class:'banner',text:'Загружаю данные…'}):null);
  a.replaceChildren(bn,cur==='draw'?pageDraw():pageParticipants());
  document.querySelectorAll('#nav a[data-p]').forEach(l=>l.classList.toggle('on',l.dataset.p===cur));
}
addEventListener('hashchange',()=>{cur=location.hash.slice(1)==='draw'?'draw':'participants';render();scrollTo(0,0)});
document.getElementById('out').addEventListener('click',e=>{e.preventDefault();sb&&sb.auth.signOut()});
document.getElementById('dlg').addEventListener('close',render);

if(configured){
